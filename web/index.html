<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1217" />
    <meta name="description" content="Nexurgy — AI engineering from an idea to 3D models, drawings, process plans and quotes, with traceable results for human review." />
    <title>Nexurgy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Cpath d='M7 24V8h4l10 12V8h4v16h-4L11 12v12Z' fill='%23ff7a2f'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme and language before first paint (same keys as
      // prefs/ThemeProvider.tsx and i18n/core.ts) to avoid a flash.
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem('partroute.theme');
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          d.setAttribute('data-theme', dark ? 'dark' : 'light');
          d.setAttribute('lang', localStorage.getItem('partroute.lang') === 'zh' ? 'zh-CN' : 'en');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Nexurgy needs JavaScript. · Nexurgy 需要启用 JavaScript。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
