[project]
name = "partroute-server"
version = "0.4.0"
description = "PartRoute v0.4 backend: projects, cloud CAD kernel, AI modeling, workflows"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "build123d>=0.13",
  "google-genai>=1.0",
  "openai>=1.50",
  # Agent tool_agent runtime (P1). Pinned: framework imports live only in app/ai/harness/tool_agent.py.
  "pydantic-ai-slim[openai,google]==2.55.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "ezdwg==0.12.12 ; (platform_machine == 'x86_64' and sys_platform == 'linux') or sys_platform == 'darwin'",
  "cryptography>=44",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.18"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
